<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeHaven — Child Safety & Guardian Monitoring</title>
  <meta name="description" content="A modern, aesthetic, and reliable Child Safety & Guardian Monitoring application with real-time tracking, explainable danger detection, safe zones, and instant SOS." />

  <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0e6b5c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SafeHaven" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

  <!-- Google Fonts: Instrument Sans (UI) + Instrument Serif (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS & JS for Interactive Maps (Local with CDN fallback) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/parent.css" />
  <link rel="stylesheet" href="css/child.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/premium.css" />
</head>
<body>
  <div id="app-root">

    <!-- Top Universal Header & Switcher Bar -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo" title="SafeHaven">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5.5c0 4.4-2.9 8.2-7 9.5-4.1-1.3-7-5.1-7-9.5V6l7-3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
        </div>
        <h1 class="brand-wordmark">SafeHaven</h1>
      </div>

      <div class="header-actions">
        <div class="mode-segmented-control" role="tablist" aria-label="User mode">
          <button class="mode-btn active" data-mode="parent" onclick="window.switchMode('parent')" title="Parent dashboard">Parent</button>
          <button class="mode-btn" data-mode="child" onclick="window.switchMode('child')" title="Child device view">Child</button>
        </div>

        <button id="gmail-auth-btn" class="header-gmail-btn" onclick="window.openGmailLoginModal()" title="Guardian account">
          <span class="gmail-google-g">V</span>
          <span id="header-gmail-email" class="gmail-email-text">vansh.koul@gmail.com</span>
        </button>

        <button id="pwa-install-btn" class="header-install-btn" onclick="window.promptPWAInstall()" title="Install SafeHaven">
          <span class="install-btn-label">Install</span>
        </button>

        <button id="view-mode-toggle-btn" class="icon-btn active" onclick="window.toggleMobilePreview()" title="Switch between phone preview and full width"></button>
        <button id="audio-toggle-btn" class="icon-btn" title="Sound alerts" onclick="window.toggleAudioMute()"></button>
        <button id="theme-toggle-btn" class="icon-btn" title="Light or dark theme" onclick="window.toggleTheme()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport Shell -->
    <main id="main-viewport" class="main-viewport mobile-preview-mode">
      <!-- 1. Parent Guardian Dashboard Mode Container -->
      <div id="parent-container" class="parent-view" style="display: flex;">
        <div id="parent-content-area" class="parent-content-area">
          <!-- Rendered dynamically by parentUI.js -->
        </div>

        <!-- Bottom Navigation Bar for Parent Mode -->
        <nav class="parent-bottom-nav" aria-label="Parent Dashboard Navigation">
          <button class="nav-item active" data-tab="home" onclick="window.switchTab('home')" id="nav-btn-home" title="Family Overview">
            <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>
            <span>Home</span>
          </button>
          <button class="nav-item" data-tab="map" onclick="window.switchTab('map')" id="nav-btn-map" title="Interactive GPS Map">
            <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
            <span>Map</span>
          </button>
          <button class="nav-item" data-tab="alerts" onclick="window.switchTab('alerts')" id="nav-btn-alerts" title="Safety Alerts">
            <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
            <span>Alerts</span>
          </button>
          <button class="nav-item" data-tab="settings" onclick="window.switchTab('settings')" id="nav-btn-settings" title="Guardian Settings">
            <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.700 1.700 0 0 0 .3-1.900 1.700 1.700 0 0 0-1.500-1H3a2 2 0 1 1 0-4h.1a1.700 1.700 0 0 0 1.500-1.100 1.700 1.700 0 0 0-.3-1.900l-.1-.1a2 2 0 1 1 2.800-2.800l.1.1a1.700 1.700 0 0 0 1.900.3H9a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.900-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.100a1.700 1.700 0 0 0-.3 1.900V9a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>
            <span>Settings</span>
          </button>
        </nav>
      </div>

      <!-- 2. Child App Interface Mode Container -->
      <div id="child-container" class="child-view-container" style="display: none; height: 100%;">
        <div id="child-content-area" style="height: 100%;">
          <!-- Rendered dynamically by childUI.js -->
        </div>
      </div>
    </main>

    <!-- Toast Notifications Toasting Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

  </div>

  <!-- Main Application ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
