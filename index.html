<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SafeHaven — Child Safety & Guardian Monitoring</title>
  <meta name="description" content="Calm, reliable child safety for families: live location, explainable alerts, safe zones and instant SOS." />

  <!-- Progressive Web App (PWA) Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0f11" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SafeHaven" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

  <!-- Type: Geist (interface), Geist Mono (data), Instrument Serif (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- Leaflet (local) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>

  <link rel="stylesheet" href="css/app.css" />

  <!-- Live mode: public client config from the server (no secrets), then the Supabase client (local) -->
  <script src="app-config.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
</head>
<body data-mode="parent">
  <div id="app-root">

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5.5c0 4.4 2.9 8.2 7 9.5 4.1-1.3 7-5.1 7-9.5V6l-7-3z"/><path d="m9 12 2 2 4-4"/></svg>
        </span>
        <span class="brand__name">SafeHaven</span>
        <span id="live-role-tag" class="pill pill--neutral pill--xs live-role-tag" hidden></span>
      </div>

      <div class="seg mode-switch" role="tablist" aria-label="View as">
        <button class="seg__btn mode-btn active" data-mode="parent" role="tab" aria-selected="true" onclick="window.switchMode('parent')">Guardian</button>
        <button class="seg__btn mode-btn" data-mode="child" role="tab" aria-selected="false" onclick="window.switchMode('child')">Child</button>
      </div>

      <div class="topbar__actions">
        <span id="live-tracking-indicator" class="live-indicator" role="status" hidden><i class="live-indicator__dot"></i>Sharing location</span>
        <button id="pwa-install-btn" class="btn btn--soft btn--sm topbar__install" onclick="window.promptPWAInstall()" hidden>Install app</button>
        <button id="audio-toggle-btn" class="icon-btn" aria-label="Sound alerts" title="Sound alerts" onclick="window.toggleAudioMute()"></button>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Theme" title="Light or dark theme" onclick="window.toggleTheme()"></button>
        <button id="gmail-auth-btn" class="account-chip" onclick="window.openGmailLoginModal()" title="Guardian account">
          <span id="header-gmail-initial" class="account-chip__avatar">V</span>
          <span id="header-gmail-email" class="account-chip__name">Vansh Koul</span>
        </button>
      </div>
    </header>

    <main id="main-viewport" class="viewport">
      <!-- Guardian dashboard -->
      <div id="parent-container" class="parent-view">
        <nav class="sidenav" aria-label="Guardian navigation">
          <button class="nav-item active" data-tab="home" onclick="window.switchTab('home')" id="nav-btn-home">
            <svg class="nav-item__icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
            <span>Home</span>
          </button>
          <button class="nav-item" data-tab="map" onclick="window.switchTab('map')" id="nav-btn-map">
            <svg class="nav-item__icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
            <span>Map</span>
          </button>
          <button class="nav-item" data-tab="alerts" onclick="window.switchTab('alerts')" id="nav-btn-alerts">
            <span class="nav-item__iconwrap">
              <svg class="nav-item__icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8.5 3 8.5H3S6 15 6 8"/><path d="M10.3 20a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span class="nav-badge" data-alert-count hidden>0</span>
            </span>
            <span>Alerts</span>
          </button>
          <button class="nav-item" data-tab="children" onclick="window.switchTab('children')" id="nav-btn-children">
            <svg class="nav-item__icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Family</span>
          </button>
          <button class="nav-item" data-tab="settings" onclick="window.switchTab('settings')" id="nav-btn-settings">
            <svg class="nav-item__icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span>Settings</span>
          </button>

          <div class="sidenav__foot">
            <button class="sidenav__sos" onclick="window.callEmergencyServices()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16.4v2.8a1.9 1.9 0 0 1-2.1 1.9 18.8 18.8 0 0 1-8.2-2.9 18.5 18.5 0 0 1-5.7-5.7A18.8 18.8 0 0 1 2.1 4.2 1.9 1.9 0 0 1 4 2.1h2.8a1.9 1.9 0 0 1 1.9 1.6c.1.9.3 1.8.7 2.7a1.9 1.9 0 0 1-.4 2L7.8 9.6a15.2 15.2 0 0 0 5.7 5.7l1.2-1.2a1.9 1.9 0 0 1 2-.4c.9.3 1.8.6 2.7.7a1.9 1.9 0 0 1 1.6 2z"/></svg>
              <span>Emergency numbers</span>
            </button>
          </div>
        </nav>

        <div id="parent-content-area" class="content"></div>
      </div>

      <!-- Child device view -->
      <div id="child-container" class="child-view" hidden>
        <div id="child-content-area"></div>
      </div>
    </main>

    <!-- Live mode (real accounts and data) renders here -->
    <main id="live-root" class="live-root" hidden></main>

    <div id="toast-container" class="toasts" aria-live="polite"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
